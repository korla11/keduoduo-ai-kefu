<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客多多AI客服系统</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .landing { max-width: 600px; margin: 80px auto; text-align: center; padding: 0 20px; }
        .landing h1 { font-size: 2.2em; margin-bottom: 8px; }
        .landing .subtitle { color: #888; margin-bottom: 40px; }
        .platform-cards { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        .platform-card {
            display: block; width: 200px; padding: 32px 20px;
            border: 1px solid #e0e0e0; border-radius: 12px;
            text-decoration: none; color: inherit;
            transition: box-shadow .2s, transform .2s;
        }
        .platform-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.12); transform: translateY(-2px); }
        .platform-card .icon { font-size: 2.5em; margin-bottom: 12px; }
        .platform-card .name { font-size: 1.2em; font-weight: bold; }
        .platform-card .desc { font-size: .85em; color: #888; margin-top: 8px; }
        .landing .footer-links { margin-top: 40px; }
        .landing .footer-links a { margin: 0 12px; color: #666; text-decoration: none; }
        .landing .footer-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="landing">
        <h1>客多多AI客服系统</h1>
        <div class="subtitle">消息自动回复系统（精简版）</div>
        <div class="platform-cards">
            <a class="platform-card" href="/laike">
                <div class="icon"><img src="laike-icon.png" alt="抖音来客" style="width:1em;height:1em;object-fit:contain;vertical-align:middle"></div>
                <div class="name">抖音来客</div>
                <div class="desc">商家后台私信自动回复</div>
            </a>
            <a class="platform-card" href="/douyin">
                <div class="icon">🎵</div>
                <div class="name">抖音私信</div>
                <div class="desc">浏览器自动化回复</div>
            </a>
            <a class="platform-card" href="/xiaohongshu">
                <div class="icon">📕</div>
                <div class="name">小红书私信</div>
                <div class="desc">浏览器自动化回复</div>
            </a>
        </div>
        <div class="footer-links">
            <a href="/dashboard">仪表盘</a>
            <a href="/logs">系统日志</a>
        </div>
    </div>
</body>
</html>
